spring.application.name=todolist

# ===== Database H2 (chay trong bo nho RAM) =====
# jdbc:h2:mem:tododb -> DB ten "tododb" nam trong RAM. Tat app la mat du lieu.
# Muon luu ra file (khong mat khi tat) doi thanh: jdbc:h2:file:./data/tododb
spring.datasource.url=jdbc:h2:mem:tododb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Tu dong tao/cap nhat bang tu cac Entity moi khi chay app
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Bat trang xem du lieu H2 tai: http://localhost:8080/h2-console
# (JDBC URL o o dang nhap dien: jdbc:h2:mem:tododb)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===== Cau hinh JWT =====
# secret: chuoi bi mat de KY token. Toi thieu 32 ky tu (256 bit) cho thuat toan HS256.
app.jwt.secret=mindx-todolist-secret-key-hay-doi-thanh-cua-rieng-ban-2026
# expiration: thoi gian song cua token, tinh bang mili-giay. 86400000 = 24 gio.
app.jwt.expiration=86400000
