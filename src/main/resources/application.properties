spring.application.name=todolist

# Use the PORT provided by the host (e.g. Railway); default 8080 locally.
server.port=${PORT:8080}

# H2 file-based database: data is kept in ./data/tododb.mv.db, so it survives rebuild/restart.
# (In-memory alternative that wipes on stop: jdbc:h2:mem:tododb;DB_CLOSE_DELAY=-1)
spring.datasource.url=jdbc:h2:file:./data/tododb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 web console at http://localhost:8080/h2-console (JDBC URL: jdbc:h2:file:./data/tododb)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
logging.level.org.springframework.security=TRACE

# JWT config. secret: signing key, at least 32 chars for HS256. expiration: token lifetime in ms (86400000 = 24h).
app.jwt.secret=todolist-secret-key-change-this-to-your-own-2026
app.jwt.expiration=86400000
