<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Task</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container" style="max-width: 560px; margin-top: 40px;">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h4 class="mb-4">Edit task</h4>

            <div class="alert alert-danger py-2" th:if="${error}" th:text="${error}"></div>

            <form method="post" th:action="@{'/tasks/' + ${task.id} + '/edit'}">
                <div class="mb-3">
                    <label class="form-label">Title *</label>
                    <input type="text" name="title" class="form-control"
                           th:value="${task.title}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Description</label>
                    <textarea name="description" class="form-control" rows="3"
                              th:text="${task.description}"></textarea>
                </div>
                <div class="d-flex justify-content-between">
                    <a th:href="@{/tasks}" class="btn btn-outline-secondary">Back</a>
                    <button type="submit" class="btn btn-primary">Save changes</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
