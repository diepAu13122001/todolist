<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <span class="navbar-brand mb-0 h1">Todo List</span>
        <div class="d-flex align-items-center text-white">
            <span class="me-3">Hi, <b th:text="${username}">user</b></span>
            <form method="post" th:action="@{/logout}">
                <button class="btn btn-outline-light btn-sm">Logout</button>
            </form>
        </div>
    </div>
</nav>

<div class="container" style="max-width: 760px; margin-top: 24px;">

    <div class="alert alert-success py-2" th:if="${message}" th:text="${message}"></div>
    <div class="alert alert-danger py-2" th:if="${error}" th:text="${error}"></div>

    <!-- Add task -->
    <div class="card shadow-sm mb-3">
        <div class="card-body">
            <form method="post" th:action="@{/tasks}" class="row g-2">
                <div class="col-12 col-md-4">
                    <input type="text" name="title" class="form-control" placeholder="Task title *" required autofocus>
                </div>
                <div class="col-12 col-md-6">
                    <input type="text" name="description" class="form-control" placeholder="Description (optional)">
                </div>
                <div class="col-12 col-md-2 d-grid">
                    <button class="btn btn-primary">Add</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Search + status filter -->
    <form method="get" th:action="@{/tasks}" class="row g-2 mb-3">
        <div class="col-7">
            <input type="text" name="q" class="form-control" placeholder="Search by title..." th:value="${q}">
        </div>
        <div class="col-3">
            <select name="status" class="form-select" onchange="this.form.submit()">
                <option value="all"    th:selected="${status == 'all'}">All</option>
                <option value="active" th:selected="${status == 'active'}">Active</option>
                <option value="done"   th:selected="${status == 'done'}">Done</option>
            </select>
        </div>
        <div class="col-2 d-grid">
            <button class="btn btn-outline-secondary">Search</button>
        </div>
    </form>

    <p class="text-muted small">
        Total: <b th:text="${total}">0</b> &middot;
        Done: <b th:text="${doneCount}">0</b>
    </p>

    <!-- Task list -->
    <div class="list-group shadow-sm">
        <div class="list-group-item text-center text-muted py-4" th:if="${#lists.isEmpty(tasks)}">
            No tasks yet.
        </div>

        <div class="list-group-item d-flex align-items-center" th:each="task : ${tasks}">
            <form method="post" th:action="@{'/tasks/' + ${task.id} + '/toggle'}" class="me-3">
                <button class="btn btn-sm d-inline-flex align-items-center justify-content-center p-0"
                        style="width: 32px; height: 32px;"
                        th:classappend="${task.completed} ? 'btn-success' : 'btn-outline-secondary'"
                        title="Toggle status"
                        th:text="${task.completed} ? '✓' : ''">✓</button>
            </form>

            <div class="flex-grow-1">
                <div th:classappend="${task.completed} ? 'text-decoration-line-through text-muted' : ''">
                    <b th:text="${task.title}">Title</b>
                </div>
                <div class="small text-muted" th:if="${task.description}" th:text="${task.description}">Description</div>
            </div>

            <a class="btn btn-sm btn-outline-primary me-2"
               th:href="@{'/tasks/' + ${task.id} + '/edit'}">Edit</a>
            <form method="post" th:action="@{'/tasks/' + ${task.id} + '/delete'}"
                  onsubmit="return confirm('Delete this task?');">
                <button class="btn btn-sm btn-outline-danger">Delete</button>
            </form>
        </div>
    </div>

</div>
</body>
</html>
