<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container" style="max-width: 420px; margin-top: 8vh;">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h3 class="card-title text-center mb-4">Login</h3>

            <div class="alert alert-success py-2" th:if="${param.registered}">
                Registration successful! Please log in.
            </div>
            <div class="alert alert-secondary py-2" th:if="${param.logout}">
                You have been logged out.
            </div>
            <div class="alert alert-danger py-2" th:if="${error}" th:text="${error}"></div>

            <form method="post" th:action="@{/login}">
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Login</button>
            </form>

            <p class="text-center mt-3 mb-0">
                No account yet? <a th:href="@{/register}">Register</a>
            </p>
        </div>
    </div>
</div>
</body>
</html>
